<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopi Senja - Video 9:16 (8 detik)</title>
<style>
  :root{--espresso:#2B1B12;--cream:#F5E9D7;--amber:#D98E32;
        --serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;
         transform-origin:0 0;background:radial-gradient(ellipse at 50% 42%,#4A2E1C 0%,#2B1B12 70%)}
  #glow{position:absolute;left:140px;top:420px;width:800px;height:800px;border-radius:50%;
        background:radial-gradient(circle,rgba(217,142,50,.6) 0%,rgba(217,142,50,0) 68%);opacity:0}
  svg{position:absolute;left:0;top:0}
  .abs{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
  .hook{font-family:var(--serif);font-size:128px;line-height:1.1;color:var(--cream);font-weight:700}
  .hook.amber{color:var(--amber);font-style:italic;font-weight:400}
  .head1{font-family:var(--serif);font-size:104px;font-weight:700;color:var(--cream)}
  .head2{font-family:var(--serif);font-size:104px;font-style:italic;color:var(--amber)}
  .brand{font-family:var(--serif);font-size:44px;letter-spacing:.4em;text-indent:.4em;color:var(--amber)}
  .pill{position:absolute;left:290px;width:500px;height:100px;border-radius:50px;background:var(--cream);
        color:var(--espresso);font:800 40px/100px var(--sans);letter-spacing:.06em;text-align:center;opacity:0}
  .badge{position:absolute;left:770px;top:560px;width:230px;height:230px;border-radius:50%;background:var(--amber);
         color:var(--espresso);font-family:var(--sans);text-align:center;opacity:0}
  .badge .s{font-weight:700;font-size:28px;letter-spacing:.12em;margin-top:62px}
  .badge .p{font-weight:800;font-size:46px;margin-top:6px}
  .cap{position:absolute;left:80px;width:920px;top:1420px;text-align:center;opacity:0;
       font:700 54px/1.25 var(--sans);color:var(--cream);background:rgba(43,27,18,.72);
       padding:18px 28px;border-radius:26px;box-sizing:border-box}
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>

  <div class="abs hook" id="h1" style="top:640px">Sore ini,</div>
  <div class="abs hook" id="h2" style="top:790px">kamu butuh</div>
  <div class="abs hook amber" id="h3" style="top:940px">yang dingin.</div>

  <div class="abs head1" id="hd1" style="top:170px">Es Kopi Susu</div>
  <div class="abs head2" id="hd2" style="top:290px">Gula Aren</div>
  <div class="abs brand" id="brand" style="top:190px">KOPI SENJA</div>
  <div class="pill" id="cta" style="top:290px">COBA HARI INI</div>

  <svg width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <linearGradient id="coffee" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="1040">
        <stop offset="0" stop-color="#F5E9D7"/><stop offset="0.38" stop-color="#E9C99A"/>
        <stop offset="0.62" stop-color="#C98A3C"/><stop offset="1" stop-color="#5A3216"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#F5E9D7" stop-opacity="0.35"/><stop offset="0.5" stop-color="#F5E9D7" stop-opacity="0.08"/>
        <stop offset="1" stop-color="#F5E9D7" stop-opacity="0.25"/>
      </linearGradient>
      <clipPath id="cup"><path d="M370 470 L710 470 L682 1010 Q678 1040 648 1040 L432 1040 Q402 1040 398 1010 Z"/></clipPath>
    </defs>
    <g id="cam"><g id="glassWrap">
      <g clip-path="url(#cup)">
        <rect x="360" y="470" width="360" height="580" fill="#2B1B12" opacity="0.5"/>
        <rect id="liquid" x="360" y="1050" width="360" height="500" fill="url(#coffee)"/>
        <g id="swirl" opacity="0">
          <path id="sw1" d="M420 640 Q470 600 520 650 T620 640" fill="none" stroke="#5A3216" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
          <path id="sw2" d="M440 720 Q500 690 550 735 T665 715" fill="none" stroke="#5A3216" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
        </g>
      </g>
      <g id="ice" fill="#F5E9D7" fill-opacity="0.38" stroke="#F5E9D7" stroke-opacity="0.7" stroke-width="3">
        <g id="ic0"><rect x="418" y="520" width="104" height="104" rx="16" transform="rotate(-12 470 572)"/></g>
        <g id="ic1"><rect x="540" y="500" width="112" height="112" rx="16" transform="rotate(9 596 556)"/></g>
        <g id="ic2"><rect x="470" y="640" width="100" height="100" rx="16" transform="rotate(6 520 690)"/></g>
        <g id="ic3"><rect x="578" y="660" width="92" height="92" rx="14" transform="rotate(-14 624 706)"/></g>
      </g>
      <rect id="stream" x="591" y="300" width="18" height="0" rx="9" fill="#C98A3C" opacity="0"/>
      <path d="M370 470 L710 470 L682 1010 Q678 1040 648 1040 L432 1040 Q402 1040 398 1010 Z" fill="url(#glass)" stroke="#F5E9D7" stroke-opacity="0.75" stroke-width="5"/>
      <path d="M398 500 L420 1000" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
      <g id="straw" opacity="0">
        <path d="M640 380 L606 560" stroke="#D98E32" stroke-width="22" stroke-linecap="round"/>
        <path d="M640 380 L606 560" stroke="#F5E9D7" stroke-width="6" stroke-linecap="round" stroke-dasharray="26 26" opacity="0.8"/>
      </g>
      <g id="drops" fill="#F5E9D7" fill-opacity="0.6" opacity="0">
        <circle cx="672" cy="620" r="7"/><circle cx="660" cy="780" r="9"/><circle cx="650" cy="900" r="6"/>
        <circle cx="420" cy="860" r="7"/><circle cx="432" cy="960" r="5"/>
      </g>
      <ellipse cx="540" cy="1056" rx="190" ry="16" fill="#000" opacity="0.35"/>
    </g></g>
  </svg>

  <div class="badge" id="badge"><div class="s">HANYA</div><div class="p">Rp25.000</div></div>
  <div class="cap" id="capA">Es kopi susu gula aren. Gula aren asli, susu segar, es batu penuh.</div>
  <div class="cap" id="capB">Rp25.000. Coba hari ini di Kopi Senja.</div>
</div>

<script>
(function(){
  var DURATION = 8, FPS = 30;
  var $ = function(id){ return document.getElementById(id); };
  var clamp = function(x){ return Math.max(0, Math.min(1, x)); };
  var prog = function(t,a,b){ return clamp((t-a)/(b-a)); };
  var easeOut = function(p){ return 1 - Math.pow(1-p,3); };
  var easeIn = function(p){ return p*p*p; };
  var easeInOut = function(p){ return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; };
  var easeBack = function(p){ var c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
  var lerp = function(a,b,p){ return a+(b-a)*p; };
  // visible window with fade in/out
  var win = function(t,a,b,fi,fo){ return Math.min(prog(t,a,a+fi), 1-prog(t,b-fo,b)); };

  // GLASS GEOMETRY: poster coordinates, scaled 1.35 and placed with top at y=560
  var ICE_START = [2.3,2.5,2.7,2.9], FALL = 0.35;           // landings 2.65, 2.85, 3.05, 3.25 (audio uses the same)
  var ICE_REST  = [406,418,190,168];                         // downward offset while resting at bottom of glass
  var POUR_A = 3.4, POUR_B = 4.8;

  function render(t){
    // hook words
    ['h1','h2','h3'].forEach(function(id,i){
      var a = 0.3 + i*0.4;
      var p = easeOut(prog(t,a,a+0.5)), o = Math.min(p, 1-prog(t,1.4,1.8));
      var el = $(id); el.style.opacity = o; el.style.transform = 'translateY('+(1-p)*50+'px)';
    });
    // glow
    $('glow').style.opacity = lerp(0.25,0.95,easeInOut(prog(t,1.0,5.0)));
    $('glow').style.transform = 'scale('+lerp(0.85,1.1,easeInOut(prog(t,1.0,8.0)))+')';

    // glass slides in, slow push-in
    var gp = easeOut(prog(t,1.8,2.3));
    var push = lerp(1.0,1.05,easeInOut(prog(t,2.0,8.0)));
    $('glassWrap').setAttribute('transform','translate(540 '+(560+(1-gp)*140)+') scale('+1.35*push+') translate(-540 -470)');
    $('glassWrap').setAttribute('opacity', gp);

    // ice falls
    for (var i=0;i<4;i++){
      var s = ICE_START[i];
      var rise = easeInOut(prog(t,POUR_A,POUR_B));
      var dy;
      if (t < s) dy = -520;
      else if (t < s+FALL) dy = lerp(-520, ICE_REST[i], easeIn(prog(t,s,s+FALL)));
      else {
        var b = prog(t,s+FALL,s+FALL+0.18);
        dy = ICE_REST[i] - Math.sin(b*Math.PI)*14;
      }
      if (t >= POUR_A) dy = lerp(ICE_REST[i], 0, rise);
      var ic = $('ic'+i);
      ic.setAttribute('transform','translate(0 '+dy+')');
      ic.setAttribute('opacity', t < s ? 0 : 1);
    }

    // pour: liquid rises, stream drops from above
    var lv = easeOut(prog(t,POUR_A,POUR_B));
    var top = lerp(1050,560,lv);
    $('liquid').setAttribute('y', top);
    var sOn = (t>=POUR_A-0.05 && t<=POUR_B+0.05);
    var sTop = 400;
    $('stream').setAttribute('opacity', sOn ? Math.min(prog(t,POUR_A-0.05,POUR_A+0.1),1-prog(t,POUR_B-0.1,POUR_B+0.05)) : 0);
    $('stream').setAttribute('y', sTop);
    $('stream').setAttribute('height', Math.max(0, top - sTop + 4));

    // swirl draws in, straw drops, condensation
    $('swirl').setAttribute('opacity', easeOut(prog(t,4.8,5.4)));
    var st = easeOut(prog(t,5.0,5.5));
    $('straw').setAttribute('opacity', st);
    $('straw').setAttribute('transform','translate(0 '+(-80*(1-st))+')');
    $('drops').setAttribute('opacity', 0.9*prog(t,5.2,5.8));

    // headline, captions, CTA
    var hd = win(t,2.0,6.0,0.5,0.4);
    ['hd1','hd2'].forEach(function(id,i){
      var el = $(id), p = easeOut(prog(t,2.0+i*0.15,2.6+i*0.15));
      el.style.opacity = Math.min(p, 1-prog(t,5.8,6.2)); el.style.transform = 'translateY('+(1-p)*-40+'px)';
    });
    $('capA').style.opacity = win(t,2.2,5.8,0.3,0.3);
    $('capB').style.opacity = win(t,6.2,8.0,0.3,0.001);
    var bp = easeOut(prog(t,6.3,6.8));
    $('brand').style.opacity = bp; $('brand').style.transform = 'translateY('+(1-bp)*-30+'px)';
    var cp = easeOut(prog(t,6.6,7.1));
    $('cta').style.opacity = cp; $('cta').style.transform = 'translateY('+(1-cp)*30+'px)';

    // price badge pops
    var pp = prog(t,6.2,6.7);
    $('badge').style.opacity = pp > 0 ? 1 : 0;
    $('badge').style.transform = 'rotate(-8deg) scale('+(pp>0 ? easeBack(pp) : 0)+')';
  }
  window.renderFrame = render;
  window.VIDEO = {duration: DURATION, fps: FPS};

  var params = new URLSearchParams(location.search);
  var stage = $('stage');
  function fit(){
    var s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = 'scale('+s+')';
    stage.style.left = ((innerWidth-1080*s)/2)+'px';
    stage.style.top  = ((innerHeight-1920*s)/2)+'px';
  }
  if (params.get('render')) {            // used by the renderer: exact size, no animation loop
    render(0);
  } else {                                // phone preview: scaled to fit, loops, tap-free
    fit(); addEventListener('resize', fit);
    if (params.get('t')) { render(parseFloat(params.get('t'))); }
    else {
      var t0 = performance.now();
      (function loop(now){
        var el = ((now - t0) / 1000) % (DURATION + 1);
        render(Math.min(el, DURATION));
        requestAnimationFrame(loop);
      })(t0);
    }
  }
})();
</script>
</body>
</html>
