<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Matcha - 3D motion ad (9:16)</title>
<style>
@font-face{font-family:AB;src:url(../../../assets/fonts/archivo-black-wide.woff)}
@font-face{font-family:AM;src:url(../../../assets/fonts/archivo-medium.woff)}
@font-face{font-family:KS;src:url(../../../assets/fonts/kaushan.woff)}
@font-face{font-family:DM;src:url(../../../assets/fonts/dmmono.woff)}
html,body{margin:0;background:#111}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#E9E7D8;color:#1F2A0C}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
.abs{position:absolute}.mono{font-family:DM;font-size:22px;letter-spacing:1.5px;white-space:nowrap;text-transform:uppercase}
.rule{position:absolute;left:70px;width:940px;height:3px;background:#1F2A0C;transform-origin:0 50%}
.script{position:absolute;left:540px;top:1120px;font-family:KS;font-size:170px;color:#B0121C;white-space:nowrap;transform:rotate(-8deg);transform-origin:0 100%;clip-path:inset(-20% 100% -20% 0);z-index:3}
.ft{position:absolute;left:70px;width:940px;display:flex;justify-content:space-between;white-space:nowrap}
.big{font-family:AM;font-size:30px;text-transform:uppercase}
#cap{left:70px;top:1545px;font-size:26px;letter-spacing:2px}
#grain{position:absolute;inset:-300px;background:url(../../cold-brew/video/grain.png);opacity:.18;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"../../../assets/vendor/three/three.module.js"}}</script>
</head><body><div id="stage">
 <canvas id="c" width="1080" height="1920"></canvas>
 <div class="abs mono" style="left:70px;top:210px" id="h1">Matcha &copy;</div>
 <div class="abs mono" style="left:0;width:1080px;text-align:center;top:210px" id="h2">N&ordm; 02 / Batch</div>
 <div class="abs mono" style="right:70px;top:210px" id="h3">Iced</div>
 <div class="rule" id="r0" style="top:270px"></div>
 <div class="script" id="script">iced</div>
 <div class="rule" id="r1" style="top:1380px"></div>
 <div class="ft big" id="f1" style="top:1406px"><span>Stone-ground matcha*</span><span>No syrup. No rush.</span></div>
 <div class="rule" id="r2" style="top:1470px"></div>
 <div class="ft mono" id="f2" style="top:1494px"><span>Net 350 ml*</span><span>Serve over ice</span><span>Rp XX.XXX*</span></div>
 <div class="abs mono" id="cap" style="opacity:0"></div>
 <div id="grain"></div>
</div>
<script src="timing.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script type="module">
import {createScene} from '../scene/scene.js';
const T=window.TIMING,$=s=>document.querySelector(s);
await Promise.all(['AB','AM','KS','DM'].map(f=>document.fonts.load('20px '+f)));
const S=await createScene({canvas:$('#c'),width:1080,height:1920,pixelRatio:1,rows:5});
const sm=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
const K=(keys,t)=>{if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,va]=keys[i-1],[b,vb]=keys[i];return va+(vb-va)*sm((t-a)/(b-a));}}return keys[keys.length-1][1];};
const camAt=t=>({
 dist:K([[0,10.0],[3.6,8.2],[5.4,8.2],[7.2,5.2],[9.2,7.8],[10,7.6]],t),
 ty:K([[0,1.2],[3.6,1.35],[5.4,1.35],[7.2,1.85],[9.2,1.4],[10,1.38]],t),
 el:K([[0,.04],[3.6,.2],[5.4,.2],[7.2,.3],[9.2,.2],[10,.2]],t),
 az:K([[0,-.18],[5,.14],[7.5,-.1],[10,0]],t),
 tx:0});
const tl=gsap.timeline({paused:true});
tl.from(['#h1','#h2','#h3'],{y:24,opacity:0,duration:.5,ease:'power3.out',stagger:.08},.05).from('#r0',{scaleX:0,duration:.7,ease:'expo.out'},.1);
tl.to('#script',{clipPath:'inset(-20% 0% -20% 0)',duration:.9,ease:'power2.inOut'},T.script).fromTo('#script',{scale:1.12},{scale:1,duration:.9,ease:'power2.out'},T.script);
['#r1','#r2'].forEach((r,i)=>tl.from(r,{scaleX:0,duration:.6,ease:'expo.out'},T.footer[i]-.1));
tl.from('#f1',{y:30,opacity:0,duration:.5,ease:'power3.out'},T.footer[0]).from('#f2',{y:30,opacity:0,duration:.5,ease:'power3.out'},T.footer[1]);
const caps=[[0.4,'matcha.'],[1.2,'poured slow.'],[3.7,'over ice.'],[5.6,'no syrup. no rush.'],[8.6,'iced matcha.']];
caps.forEach(([t,txt])=>{tl.call(()=>{$('#cap').textContent=txt},null,t);tl.fromTo('#cap',{opacity:0,y:10},{opacity:1,y:0,duration:.25,ease:'power2.out'},t);});
let lastJ=-1;
window.renderFrame=function(t){tl.time(t,false);S.setCamera(camAt(t));S.render(t);
 const j=Math.floor(t*12);if(j!==lastJ){lastJ=j;$('#grain').style.transform='translate('+((j*53)%300-150)+'px,'+((j*97)%300-150)+'px)';}};
window.renderFrame(0);window.__ready=true;
if(!/render=1/.test(location.search)){const st=performance.now();(function loop(){window.renderFrame(((performance.now()-st)/1000)%T.dur);requestAnimationFrame(loop)})();}
</script></body></html>
